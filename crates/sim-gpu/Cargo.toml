[package]
name = "solidcraft-sim-gpu"
description = "SolidCraft simulation on the GPU: the lattice-Boltzmann airflow step and the conjugate heat transfer solve as wgpu compute shaders"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-sim = { workspace = true }
solidcraft-gpu = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12", "gles"] }

[dev-dependencies]
solidcraft-geom = { workspace = true }
